units:
  kx: cx+.5
  ky: cy+.5
  px: 1.25kx
  py: 1.25ky
points:
  zones:
    matrix:
      key:
        padding: 1ky
        spread: kx+.5
      columns:
        outer:
          rows.bottom.skip: true
          rows.top.skip: true
          key.splay: 4
          key.height: 1.5kx
        pinky:
          key.stagger: .33*ky
          key.splay: 0
        ring:
          key.spread: kx+.85
          key.stagger: .25*ky
          key.splay: -3
        middle:
          key.stagger: .3*ky
          key.splay: -1
        index:
          key.stagger: -.25*ky
          key.splay: -1
        inner:
          key.stagger: -.2*ky
          key.splay: 0
      rows:
        bottom:
        home:
        top:
    thumb:
      key:
        padding: 1ky
        spread: 1kx
        width: 1.25*kx
        splay: -7
      anchor:
        ref: matrix_inner_bottom
        shift: [.65kx, -1.35ky]
      columns:
        thumb:
      rows:
        thumb:
outlines:
  raw:
    - what: rectangle
      where: true
      size: [kx, ky]
  keys:
    - what: rectangle
      where: true
      size: [kx-1,ky-1]
  centers:
    - what: circle
      where: true
      radius: 1
